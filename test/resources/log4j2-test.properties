# Root logger option
status=info
name=TestLogger
appenders=console
rootLogger.level=info
rootLogger.appenderRefs=console
rootLogger.appenderRef.console.ref=Console

# SEMOSS code logs at debug; third-party libraries stay at info
logger.prerna.name=prerna
logger.prerna.level=debug

# log a line for every query or RDF call at debug, which floods the test output
logger.wrapperManager.name=prerna.rdf.engine.wrappers.WrapperManager
logger.wrapperManager.level=info
logger.rdfFileSesameEngine.name=prerna.engine.impl.rdf.RDFFileSesameEngine
logger.rdfFileSesameEngine.level=info

appender.console.type=Console
appender.console.name=Console
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{HH:mm:ss} %-5p %c{1} - %m%n