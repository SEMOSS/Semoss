# Docx4j Configuration Properties
# This file configures the docx4j library behavior

# Logging configuration
docx4j.Log4j.Configurator.disabled=true

# JAXB configuration
docx4j.jaxb.Context=org.docx4j.jaxb.Context

# Font handling
docx4j.fonts.fop.util.FopConfigUtil.substitute=true

# XSL-FO configuration
docx4j.Convert.Out.FOSettings.saveIntermediateXml=false

# Performance settings
docx4j.openpackaging.packages.WordprocessingMLPackage.useUnmarshallingImpl=false
