# Docx4j ImportXHTML Configuration Properties
# This file configures the HTML import functionality in docx4j

# HTML import settings
docx4j.convert.in.xhtml.ImageHandler=Embedded

# CSS handling
docx4j.convert.in.xhtml.EmbedCSS=true

# Table handling
docx4j.convert.in.xhtml.TableDefaultBorder=false

# Image handling
docx4j.convert.in.xhtml.ImageResolution=96

# Logging
docx4j.convert.in.xhtml.LogMessages=false
