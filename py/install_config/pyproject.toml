[project]
name = "semoss"
version = "0.1.0"
description = "semoss"
authors = [
    {name = "Ryan Weiler",email = "ryanweiler92@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.4.0",
    "annoy>=1.17.3",
    "anthropic>=0.52.2",
    "azure-ai-formrecognizer>=3.3.3",
    "azure-common>=1.1.28",
    "azure-search-documents>=11.5.2",
    "boto3>=1.37.10",
    "bs4>=0.0.2",
    "chonky==0.1.4",
    "datasets==2.14.3",
    "deepdiff>=8.3.0",
    "faiss-cpu>=1.10.0",
    "flask>=3.1.0",
    "fuzzywuzzy>=0.18.0",
    "google-auth>=2.38.0",
    "google-cloud-aiplatform>=1.83.0",
    "google-genai>=1.18.0",
    "guidance>=0.2.0",
    "gunicorn>=23.0.0",
    "huggingface-hub>=0.29.3",
    "jsonpickle>=4.0.2",
    "keybert>=0.9.0",
    "keyphrase-vectorizers>=0.0.13",
    "langchain>=0.3.20",
    "langchain-aws>=0.2.15",
    "langchain-community>=0.3.19",
    "langchain-openai>=0.3.8",
    "langchain-text-splitters>=0.3.6",
    "langgraph>=0.3.5",
    "lm-format-enforcer>=0.10.11",
    "loralib>=0.1.2",
    "markdown>=3.7",
    "matplotlib>=3.10.1",
    "nltk>=3.9.1",
    "numpy>=1.26.4,< 2",
    "openai>=1.65.5",
    "openpyxl>=3.1.5",
    "ordered-set>=4.1.0",
    # "paddleocr>=2.10.0",
    "pandas>=2.2.3",
    "pandasql>=0.7.3",
    "pdfplumber>=0.11.5",
    "peft>=0.14.0",
    "protobuf>=5.29.3",
    "pydantic>=1.10.21",
    "pyenchant>=3.2.2",
    "pyjarowinkler>=2.0.0",
    "pymupdf>=1.25.3",
    "pypdf>=5.3.1",
    "pytesseract>=0.3.13",
    "pytest>=8.3.5",
    "python-docx>=1.1.2",
    "python-levenshtein>=0.27.1",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.4.1",
    "swifter>=1.4.0",
    "text-generation>=0.6.1",
    "tiktoken>=0.9.0",
    "timm>=1.0.15",
    "trafilatura>=2.0.0",
    "transformers>=4.49.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.6.0; extra != 'gpu' and extra == 'cpu'",
    "torchvision>=0.21.0; extra != 'gpu' and extra == 'cpu'",
    "torchaudio>=2.6.0; extra != 'gpu' and extra == 'cpu'",
]

gpu = [
    "torch>=2.6.0; extra != 'cpu' and extra == 'gpu'",
    "torchvision>=0.21.0; extra != 'cpu' and extra == 'gpu'",
    "torchaudio>=2.6.0; extra != 'cpu' and extra == 'gpu'",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" }
    ]
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra != 'gpu' and extra == 'cpu'" },
    { index = "pytorch-cu118", marker = "extra != 'cpu' and extra == 'gpu'" }
]
torchvision = [
    { index = "pytorch-cpu", marker = "extra != 'gpu' and extra == 'cpu'" },
    { index = "pytorch-cu118", marker = "extra != 'cpu' and extra == 'gpu'" }
]
torchaudio = [
    { index = "pytorch-cpu", marker = "extra != 'gpu' and extra == 'cpu'" },
    { index = "pytorch-cu118", marker = "extra != 'cpu' and extra == 'gpu'" }
]
