[project]
name = "semoss"
version = "0.1.0"
description = "semoss"
authors = [
    {name = "Ryan Weiler",email = "ryanweiler92@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.4.0",
    "annoy>=1.17.3",
    "anthropic[bedrock,vertex]==0.75.0",
    "asksageclient>=1.42",
    "azure-ai-formrecognizer>=3.3.3",
    "azure-common>=1.1.28",
    "azure-search-documents>=11.5.2",
    "bm25s>=0.2.13",
    "boto3>=1.37.10",
    "bs4>=0.0.2",
    "chonky==0.1.4",
    "datasets==2.14.3",
    "deepdiff>=8.3.0",
    "detoxify>=0.5.2",
    "faiss-cpu==1.12.0",
    "flask>=3.1.0",
    "gliner>=0.2.22",
    "google-auth>=2.38.0",
    "google-cloud-aiplatform==1.112.0",
    "google-genai==1.56.0",
    "guidance>=0.2.0",
    "gunicorn>=23.0.0",
    "huggingface-hub>=0.29.3",
    "jsonpickle>=4.0.2",
    "keybert>=0.9.0",
    "keyphrase-vectorizers>=0.0.13",
    "langchain>=1.0.0",
    "langchain-community>=0.3.19",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langextract>=1.0.9",
    "langgraph>=1.0.0",
    "livekit>=1.0.17",
    "lm-format-enforcer>=0.10.11",
    "loralib>=0.1.2",
    "markdown>=3.7",
    "matplotlib>=3.10.1",
    "nltk>=3.9.1",
    "numpy>=2.2.6",
    "openai==2.14.0",
    "openpyxl>=3.1.5",
    "ordered-set>=4.1.0",
    # "paddleocr>=2.10.0",
    "pandas>=2.2.3",
    "pandasql>=0.7.3",
    "pdfplumber>=0.11.5",
    "peft==0.17.1",
    "pip-system-certs>=5.3",
    "pipecat-ai>=0.0.90",
    "protobuf>=5.29.3",
    "pyarrow==20.0.0",
    "pydantic>=2.12.5",
    "pyenchant>=3.2.2",
    "pyjarowinkler>=2.0.0",
    # "pymupdf>=1.25.3",
    "pypdf>=5.3.1",
    "pystemmer>=3.0.0",
    "pytesseract>=0.3.13",
    "pytest>=8.3.5",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "semantic-text-splitter==0.18.1",
    "sentence-transformers>=3.4.1",
    "swifter>=1.4.0",
    "text-generation>=0.6.1",
    "thefuzz>=0.22.1",
    "tiktoken>=0.9.0",
    "timm>=1.0.15",
    "trafilatura>=2.0.0",
    "transformers>=4.53.0",
    "websocket-client>=1.9.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
]
gpu = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }]
]
override-dependencies = ["openai>=1.74,<2.5", "transformers>=4.53.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu118", marker = "extra == 'gpu' and extra != 'cpu'" }
]
torchvision = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu118", marker = "extra == 'gpu' and extra != 'cpu'" }
]
torchaudio = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu118", marker = "extra == 'gpu' and extra != 'cpu'" }
]