[project]
name = "semoss"
version = "5.3.0"
description = "semoss"
authors = [
    {name = "Ryan Weiler", email = "ryanweiler92@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "annoy>=1.17.3",
    "anthropic[bedrock,vertex]==0.116.0",
    "asksageclient>=1.42",
    "azure-ai-formrecognizer>=3.3.3",
    "azure-common>=1.1.28",
    "azure-search-documents>=11.5.2",
    "azure-core>=1.38.0",
    "bm25s>=0.2.13",
    "boto3>=1.43.9",
    "bs4>=0.0.2",
    "chonky==0.1.4",
    "claude-agent-sdk==0.2.110",
    "github-copilot-sdk==0.3.0",
    "datasets==2.14.3",
    "deepdiff>=8.3.0",
    "detoxify>=0.5.2",
    "faiss-cpu==1.12.0",
    "flask>=3.1.0",
    "gliner>=0.2.22",
    "google-auth>=2.38.0",
    "google-genai==2.10.0",
    "grpcio-status>=1.78.0",
    "guidance>=0.2.0",
    "gunicorn>=23.0.0",
    "huggingface-hub>=0.29.3",
    "jsonpickle>=4.0.2",
    "keybert>=0.9.0",
    "langchain>=1.2.17",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langextract>=1.3.0",
    "langgraph>=1.1.10",
    "livekit>=1.0.17",
    "lm-format-enforcer>=0.10.11",
    "loralib>=0.1.2",
    "markdown>=3.7",
    "matplotlib>=3.10.1",
    "nltk>=3.9.1",
    "numpy>=2.2.6",
    "openai==2.44.0",
    "openpyxl>=3.1.5",
    "ordered-set>=4.1.0",
    # "paddleocr>=2.10.0",
    "pandas==2.2.3",
    "pandasql>=0.7.3",
    "pdfplumber>=0.11.5",
    "peft==0.17.1",
    "pip-system-certs>=5.3",
    "pipecat-ai==0.0.103",
    "protobuf>=6.33.5",
    "pyarrow==20.0.0",
    "pydantic>=2.13.3",
    "pyenchant>=3.2.2",
    "pyjarowinkler>=2.0.0",
    # "pymupdf>=1.25.3",
    "pypdf>=5.3.1",
    "pystemmer>=3.0.0",
    "pytesseract>=0.3.13",
    "pytest>=8.3.5",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "semantic-text-splitter==0.18.1",
    "sentence-transformers>=3.4.1",
    "swifter>=1.4.0",
    "thefuzz>=0.22.1",
    "tiktoken>=0.9.0",
    "timm>=1.0.15",
    "trafilatura>=2.0.0",
    "transformers>=4.53.0",
    "websocket-client>=1.9.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
]
gpu = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }]
]
override-dependencies = [
    "marshmallow==4.1.2",
    "protobuf>=6.33.5",
    "numpy>=2.2.6",
    "pyasn1>=0.6.3",  # CVE-2026-30922: force min version over transitive 0.6.2
    "lxml>=6.1.0",  # CVE-2026-41066: force min version over transitive 6.0.x
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu126", marker = "extra == 'gpu' and extra != 'cpu'" }
]
torchvision = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu126", marker = "extra == 'gpu' and extra != 'cpu'" }
]
torchaudio = [
  { index = "pytorch-cpu", marker = "extra == 'cpu' and extra != 'gpu'" },
  { index = "pytorch-cu126", marker = "extra == 'gpu' and extra != 'cpu'" }
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock,bedrock-runtime]>=1.42.83",
]
