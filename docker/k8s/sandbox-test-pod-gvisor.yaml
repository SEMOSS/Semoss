apiVersion: v1
kind: Pod
metadata:
  name: semoss-sandbox-gvisor
  namespace: semoss
  labels: { app: semoss-sandbox-gvisor }
spec:
  runtimeClassName: gvisor
  restartPolicy: Never
  securityContext:
    runAsUser: 1001
    runAsGroup: 0
  containers:
    - name: probe
      image: docker.cfg.deloitte.com/kunal/semoss:2026-05-29-test
      command: ["sleep", "infinity"]
      securityContext:
        capabilities:
          add: ["SYS_ADMIN", "SYS_CHROOT"]
        runAsUser: 1001
      volumeMounts:
        - name: work
          mountPath: /sandbox-work
  volumes:
    - name: work
      emptyDir: {}
