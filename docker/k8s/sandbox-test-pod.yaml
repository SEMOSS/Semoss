apiVersion: v1
kind: Pod
metadata:
  name: semoss-sandbox-test
  labels: { app: semoss-sandbox-test }
spec:
  restartPolicy: Never
  # ---------------------------------------------------------------------------
  # THE ONE SETTING THAT MATTERS: allow unprivileged user namespaces.
  #
  # Option A (quick test): Unconfined drops the container's outer seccomp filter
  # so unshare(CLONE_NEWUSER) is permitted. The sandbox we build re-applies a
  # tighter seccomp filter to the interpreter itself, so this is for TESTING /
  # and is an acceptable posture if paired with the in-jail filter.
  #
  # Option B (production, preferred): replace this with a Localhost profile that
  # equals RuntimeDefault minus the CAP_SYS_ADMIN gate on unshare/clone/setns.
  #   securityContext:
  #     seccompProfile:
  #       type: Localhost
  #       localhostProfile: profiles/allow-userns.json
  #
  # Option C: pod-level user namespaces (needs cluster support, K8s 1.33 GA):
  #   hostUsers: false        # (and remove the seccompProfile override)
  # ---------------------------------------------------------------------------
  securityContext:
    runAsUser: 1001
    runAsGroup: 0
    seccompProfile:
      type: Unconfined
  containers:
    - name: probe
      # Use your real SEMOSS runtime image (so python/bwrap match production).
      # For the propagation PoC you only need python + userns (no bwrap), so any
      # python image works; for dynamic_mount_poc.sh use an image built from the
      # updated Dockerfile (now includes bubblewrap).
      image: REPLACE_WITH_YOUR_SEMOSS_IMAGE
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: true   # needed for unshare under Unconfined
        capabilities:
          drop: ["ALL"]                  # NOTE: no CAP_SYS_ADMIN added — proves it works WITHOUT it
        runAsNonRoot: true
        runAsUser: 1001
