apiVersion: v1
kind: Pod
metadata:
  name: semoss-sandbox-test
  labels: { app: semoss-sandbox-test }
  annotations:
    container.apparmor.security.beta.kubernetes.io/probe: unconfined
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1001
    runAsGroup: 0
    seccompProfile:
      type: Unconfined
  containers:
    - name: probe
      image: REPLACE_WITH_YOUR_SEMOSS_IMAGE
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 1001
        appArmorProfile:
          type: Unconfined
