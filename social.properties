# sample scope: userinfo.profile userinfo.email gmail.modify calendar drive documents
# (write each as https://www.googleapis.com/auth/<scope>, except https://mail.google.com/)
#   userinfo.profile userinfo.email  the sign in profile
#   gmail.readonly          GoogleGmailListMail, GoogleGmailGetMail, GoogleGmailListMailFolders,
#                           GoogleGmailDownloadAttachment, GoogleGmailProfileById
#   gmail.compose           GoogleGmailSaveDraft, GoogleGmailSendDraft, GoogleGmailSendMail,
#                           and with gmail.readonly GoogleGmailReplyMail, GoogleGmailForwardMail
#   gmail.send              GoogleGmailSendMail
#   gmail.modify            every GoogleGmail reactor, including GoogleGmailMoveMail,
#                           GoogleGmailMarkMailRead and GoogleGmailDeleteMail
#   calendar.readonly       GoogleCalendarListCalendars, GoogleCalendarListEvents,
#                           GoogleCalendarGetEvent, GoogleCalendarGetSchedule
#   calendar.events         GoogleCalendarCreateEvent, GoogleCalendarUpdateEvent,
#                           GoogleCalendarDeleteEvent, GoogleCalendarRespondToEvent,
#                           GoogleCalendarListEvents, GoogleCalendarGetEvent
#   calendar.acls.readonly  GoogleCalendarListPermissions
#   calendar                every GoogleCalendar reactor
#   drive.readonly          GoogleDriveList, GoogleDriveRead, GoogleDriveDownload, GoogleDocsList
#   drive                   the GoogleDrive and GoogleDocs reactors, including GoogleDriveUpload,
#                           GoogleDriveDelete and GoogleDocsDelete
#   documents.readonly      GoogleDocsRead
#   documents               GoogleDocsCreate, GoogleDocsUpdate
#   cloud-language          the GoogleSentimentAnalyzer and GoogleEntityAnalyzer lambdas
google_scope https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
