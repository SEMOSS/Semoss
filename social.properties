ms_userinfo_url
# sample scope: User.Read offline_access Mail.ReadWrite Mail.Send Calendars.ReadWrite Files.ReadWrite
#   User.Read                 the sign in profile
#   offline_access            a refresh token, for Brain routines and Graph webhooks
#   Mail.Read                 MicrosoftOutlookListMail, MicrosoftOutlookGetMail,
#                             MicrosoftOutlookListMailFolders, MicrosoftOutlookDownloadAttachment,
#                             and mailbox webhooks
#   Mail.ReadWrite            MicrosoftOutlookSaveDraft, MicrosoftOutlookMoveMail,
#                             MicrosoftOutlookDeleteMail, MicrosoftOutlookMarkMailRead,
#                             MicrosoftOutlookCreateMailFolder, and every Mail.Read reactor
#   Mail.Send                 MicrosoftOutlookSendMail, MicrosoftOutlookSendDraft,
#                             MicrosoftOutlookReplyMail, MicrosoftOutlookForwardMail
#   Calendars.Read            MicrosoftCalendarListCalendars, MicrosoftCalendarListEvents,
#                             MicrosoftCalendarGetEvent, MicrosoftCalendarGetSchedule,
#                             MicrosoftCalendarListPermissions, and calendar webhooks
#   Calendars.ReadWrite       MicrosoftCalendarCreateEvent, MicrosoftCalendarUpdateEvent,
#                             MicrosoftCalendarDeleteEvent, MicrosoftCalendarRespondToEvent,
#                             and every Calendars.Read reactor
#   Calendars.Read.Shared     the Calendars.Read reactors on somebody else's calendar
#   Calendars.ReadWrite.Shared  the Calendars.ReadWrite reactors on somebody else's calendar
#   Files.Read                MicrosoftOneDriveListDrives, MicrosoftOneDriveListFiles,
#                             MicrosoftOneDriveGetFile, MicrosoftOneDriveDownloadFile,
#                             MicrosoftOneDriveSearchFiles
#   Files.Read.All            the Files.Read reactors plus MicrosoftOneDriveListSharedFiles,
#                             MicrosoftTeamsListFiles, MicrosoftTeamsDownloadFile,
#                             MicrosoftTeamsDownloadMessageAttachment
#   Files.ReadWrite           MicrosoftOneDriveUploadFile, MicrosoftOneDriveCreateFile,
#                             MicrosoftOneDriveCreateFolder, MicrosoftOneDriveDeleteFile,
#                             MicrosoftOneDriveShareFile, and every Files.Read reactor
#   Files.ReadWrite.All       every OneDrive and Teams file reactor, including
#                             MicrosoftTeamsUploadFile
#   Team.ReadBasic.All        MicrosoftTeamsListTeams
#   Channel.ReadBasic.All     MicrosoftTeamsListChannels
#   ChannelMessage.Read.All   MicrosoftTeamsListChannelMessages, MicrosoftTeamsGetChannelMessage,
#                             MicrosoftTeamsSearchMessages (needs admin consent)
#   ChannelMessage.Send       MicrosoftTeamsSendChannelMessage
#   ChannelMessage.ReadWrite  MicrosoftTeamsDeleteChannelMessage
#   Chat.ReadBasic            MicrosoftTeamsListChats, MicrosoftTeamsGetChat
#   Chat.Read                 MicrosoftTeamsListChatMessages, MicrosoftTeamsGetChatMessage,
#                             MicrosoftTeamsSearchMessages, and every Chat.ReadBasic reactor
#   Chat.Create               MicrosoftTeamsCreateChat
#   ChatMessage.Send          MicrosoftTeamsSendChatMessage
#   Chat.ReadWrite            MicrosoftTeamsDeleteChatMessage, and every Teams chat reactor
#   User.Read.All             MicrosoftTeamsCreateChat, MicrosoftTeamsSendChatMessage and
#                             MicrosoftTeamsSendChannelMessage, to find people by address
#   .default                  everything the app registration grants
ms_scope User.Read
ms_jsonPattern
ms_beanProps
ms_auto_add true
ms_access_keys_allowed false
ms_display_name
ms_groups
ms_group_url
ms_groupJsonPattern
ms_group_string_return
ms_group_string_regex
ms_sanitizeUserResponse
ms_sanitizeGroupResponse
