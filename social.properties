# linotp_auth_mode selects the authentication protocol: "rest" (default) calls
# LinOTP's own validate/check REST API (linotp_hostname/linotp_realm above);
# "radius" instead authenticates via RADIUS (RFC 2865) against the properties
# below. linotp_adminuser/linotp_adminpassword (admin counter reset) and
# linotp_hostname/linotp_realm (if also running the REST API) are unaffected -
# the admin reset endpoint has no RADIUS equivalent and always uses REST.
linotp_auth_mode             rest
linotp_radius_hostname       <LINOTPRADIUSHOSTNAME>
linotp_radius_port           1812
linotp_radius_secret         <LINOTPRADIUSSECRET>
linotp_radius_realm
linotp_radius_nas_identifier SEMOSS
linotp_radius_timeout_ms     5000
linotp_radius_retries        2

