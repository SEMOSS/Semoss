#scheduler name will be "MyScheduler"
#org.quartz.scheduler.instanceName=TestScheduler
#org.quartz.scheduler.instanceId=AUTO
 
#maximum of 3 jobs can be run simultaneously
org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount=10

#Log trigger history
#org.quartz.plugin.triggerHistory.class=org.quartz.plugins.history.LoggingTriggerHistoryPlugin
#org.quartz.plugin.triggerHistory.triggerFiredMessage=Trigger [{1}.{0}] fired job [{6}.{5}] scheduled at: {2, date, dd-MM-yyyy HH:mm:ss.SSS}, next scheduled at: {3, date, dd-MM-yyyy HH:mm:ss.SSS}
#org.quartz.plugin.triggerHistory.triggerCompleteMessage=Trigger [{1}.{0}] completed firing job [{6}.{5}] with resulting trigger instruction code: {9}. Next scheduled at: {3, date, dd-MM-yyyy HH:mm:ss.SSS}
#org.quartz.plugin.triggerHistory.triggerMisfiredMessage=Trigger [{1}.{0}] misfired job [{6}.{5}]. Should have fired at: {3, date, dd-MM-yyyy HH:mm:ss.SSS}

org.quartz.dataSource.myDS.provider=hikaricp

#Quartz persistent jobStore config
org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
org.quartz.jobStore.tablePrefix=QRTZ_
org.quartz.jobStore.dataSource=myDS
org.quartz.jobStore.useProperties=false
org.quartz.jobStore.isClustered=false

# driver/URL/user/password below are template-only placeholders: every actual
# Quartz initialization goes through SchedulerFactorySingleton.setUpQuartzProperties(),
# which loads this file then unconditionally overwrites all four with the real
# scheduler database's own driver/connection URL/credentials before the factory
# is ever initialized. Left as a real-looking admin/admin H2-on-localhost value,
# this reads as a live hardcoded credential to any secret scanner even though it
# is never actually used; left blank instead, a future change that accidentally
# stops overriding these would fail obviously (Quartz cannot connect) rather than
# silently running with a weak default.
org.quartz.dataSource.myDS.driver=
org.quartz.dataSource.myDS.URL=
org.quartz.dataSource.myDS.user=
org.quartz.dataSource.myDS.password=
org.quartz.dataSource.myDS.maxConnections=5
org.quartz.dataSource.myDS.validationQuery=select 1