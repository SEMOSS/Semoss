name: Tomcat Builder Java 25

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tomcat Version to deploy'
        required: true
        default: '11.0.24'
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'docker/Dockerfile.tomcat'
      - '.github/workflows/tomcat-builder-java25.yml'

env:
  IMAGE: quay.io/semoss/tomcat-builder
  JAVA_SUFFIX: java25

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            uname_arch: x86_64
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            uname_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TOMCAT_VERSION: ${{ github.event.inputs.version || '11.0.24' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.tomcat
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            TOMCAT_VERSION=${{ env.TOMCAT_VERSION }}
            BASE_REGISTRY=public.ecr.aws/docker/library
            BASE_TAG=24.04
            AZUL_ZULU_VERSION=25.34.17
            JDK_VERSION=25.0.3
            JAVA_HOME=/usr/lib/jvm/zulu25
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify Java 25 builder image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$image_ref"
          docker run --rm --entrypoint bash "$image_ref" -c '
            set -euo pipefail
            . /etc/os-release
            test "$VERSION_ID" = "24.04"
            test "$JAVA_HOME" = "/usr/lib/jvm/zulu25"
            test "$(uname -m)" = "${{ matrix.uname_arch }}"
            java -version 2>&1 | grep -q "25.0.3"
            mvn -version | grep -q "Java version: 25.0.3"
          '

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-java25-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    env:
      TOMCAT_VERSION: ${{ github.event.inputs.version || '11.0.24' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-java25-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          TAGS=( "-t" "${IMAGE}:${TOMCAT_VERSION}-${JAVA_SUFFIX}" )
          if [[ "${{ vars.RELEASE }}" == "TRUE" ]]; then
            TAGS+=( "-t" "${IMAGE}:${TOMCAT_VERSION}-${{ vars.VERSION }}-${JAVA_SUFFIX}" )
          fi
          echo "args=${TAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ steps.meta.outputs.args }} \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest list
        run: docker buildx imagetools inspect "${IMAGE}:${TOMCAT_VERSION}-${JAVA_SUFFIX}"
