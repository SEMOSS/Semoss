name: Tomcat Builder
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tomcat Version to deploy'
        required: true
        default: '9.0.118'
  push:
    branches: [ "dev", "main", "tomcat-update-9.0.118" ]
    paths:
      - 'docker/Dockerfile.tomcat'
      - '.github/workflows/tomcat-builder.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TOMCAT_VERSION: ${{ github.event.inputs.version || '9.0.118' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}
      - name: Build and push Tomcat Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.tomcat
          push: true
          tags: |
            quay.io/semoss/tomcat-builder:${{ env.TOMCAT_VERSION }}-test
            ${{ vars.RELEASE == 'true' && format('quay.io/semoss/tomcat-builder:{0}-{1}', env.TOMCAT_VERSION, vars.VERSION) || '' }}
          build-args: |
            TOMCAT_VERSION=${{ env.TOMCAT_VERSION }}
            BASE_REGISTRY=public.ecr.aws/docker/library
