name: Semoss Ubuntu 24 Java 25 Builder

# The Java 25 Tomcat builder must be published before this workflow runs:
# quay.io/semoss/tomcat-builder:9.0.120-java25

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'docker/Dockerfile.ubuntu24.04'
      - '.github/workflows/ubuntu2404.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      semoss_version: ${{ steps.vars.outputs.semoss_version }}
      tag_args: ${{ steps.vars.outputs.tag_args }}
      primary_tag: ${{ steps.vars.outputs.primary_tag }}
    steps:
      - name: Determine image, version and tags
        id: vars
        shell: bash
        run: |
          if [ "${{ vars.RELEASE }}" = "TRUE" ]; then
            IMAGE="quay.io/semoss/semoss"
            SV="${{ vars.VERSION }}"
            PRIMARY="${IMAGE}:${{ vars.VERSION }}-ubuntu24"
            TAGS="-t ${PRIMARY}"
          else
            DATE=$(date +'%Y-%m-%d')
            IMAGE="quay.io/semoss/semoss-dev"
            SV="${{ vars.VERSION }}-SNAPSHOT"
            PRIMARY="${IMAGE}:${{ vars.VERSION }}-SNAPSHOT-ubuntu24-${DATE}"
            TAGS="-t ${PRIMARY} -t ${IMAGE}:${{ vars.VERSION }}-SNAPSHOT-ubuntu24-latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "semoss_version=${SV}" >> "$GITHUB_OUTPUT"
          echo "tag_args=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${PRIMARY}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            uname_arch: x86_64
            runner_prefix: codebuild-semoss-github-runner
            container: quay.io/semoss/test-quay:ubuntu-dind
          - platform: linux/arm64
            arch: arm64
            uname_arch: aarch64
            runner_prefix: codebuild-semoss-github-runner-arm64
            container: quay.io/semoss/test-quay:ubuntu-dind-arm64
    runs-on: ${{ matrix.runner_prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: ${{ matrix.container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.ubuntu24.04
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          build-args: |
            SEMOSS_VERSION=${{ needs.prepare.outputs.semoss_version }}
            BASE_REGISTRY=public.ecr.aws/docker/library
            TOMCAT_BUILDER_TAG=9.0.120-java25
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify Ubuntu 24 and Java 25
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker pull "$image_ref"
          docker run --rm --entrypoint bash "$image_ref" -c '
            set -euo pipefail
            . /etc/os-release
            test "$VERSION_ID" = "24.04"
            test "$JAVA_HOME" = "/usr/lib/jvm/zulu25"
            test "$(uname -m)" = "${{ matrix.uname_arch }}"
            java -version 2>&1 | grep -q "25.0.3"
            mvn -version | grep -q "Java version: 25.0.3"
          '

      - name: Verify Tomcat startup
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}"
          container_id=$(docker run -d "$image_ref")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 60); do
            if docker logs "$container_id" 2>&1 | grep -q "Server startup in"; then
              echo "Tomcat started successfully"
              exit 0
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "Container exited before Tomcat completed startup"
              docker logs "$container_id"
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for Tomcat startup"
          docker logs "$container_id"
          exit 1

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-ubuntu24-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-ubuntu24-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create ${{ needs.prepare.outputs.tag_args }} \
            $(printf "${{ needs.prepare.outputs.image }}@sha256:%s " *)

      - name: Inspect manifest list
        run: docker buildx imagetools inspect "${{ needs.prepare.outputs.primary_tag }}"
