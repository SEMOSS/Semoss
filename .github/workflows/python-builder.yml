name: Python Builder
on:
  workflow_dispatch:
    inputs:
      # IF WE UPDATE THE DEFAULT HERE, MAKE SURE TO UPDATE THE DEFAULT IN THE env WITHIN THE JOB AS WELL
      python_version:
        description: 'Python Version to install'
        required: true
        default: '3.12'
      compute_type:
        description: 'Install either CPU or GPU packages'
        required: true
        default: 'cpu'
      base_registry:
        description: 'Base registry'
        required: true
        default: 'public.ecr.aws/docker/library'
      base_image:
        description: 'Base Image'
        required: true
        default: 'ubuntu'
      base_tag:
        description: 'Base tag'
        required: true
        default: '22.04'
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'docker/Dockerfile.python'
      - 'py/install_config/pyproject.toml'
      - '.github/workflows/python-builder.yml'

jobs:
  build:
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: quay.io/semoss/test-quay:ubuntu-dind
    env:
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.12' }}
      COMPUTE_TYPE: ${{ github.event.inputs.compute_type || 'cpu' }}
      BASE_REGISTRY: ${{ github.event.inputs.base_registry || 'public.ecr.aws/docker/library' }}
      BASE_IMAGE: ${{ github.event.inputs.base_image || 'ubuntu' }}
      BASE_TAG: ${{ github.event.inputs.base_tag || '22.04' }}
      RELEASE: ${{ vars.RELEASE }}
      VERSION: ${{ vars.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          TAG="quay.io/semoss/python-builder:${PYTHON_VERSION}-${COMPUTE_TYPE}"
          if [[ "${RELEASE}" == "true" ]]; then
            TAG="${TAG}-${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Python Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.python
          push: true
          tags: |
            quay.io/semoss/python-builder:${{ env.PYTHON_VERSION }}-${{ env.COMPUTE_TYPE }}
            ${{ vars.RELEASE == 'true' && format('quay.io/semoss/python-builder:{0}-{1}-{2}', env.PYTHON_VERSION, env.COMPUTE_TYPE, vars.VERSION) || '' }}
          build-args: |                    # TODO : Replace environment variables with github input variables before merge to dev and main
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            COMPUTE_TYPE=${{ env.COMPUTE_TYPE }}
            BASE_REGISTRY=${{ env.BASE_REGISTRY }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}
