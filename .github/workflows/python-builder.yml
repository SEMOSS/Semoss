name: Python Builder

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python Version to install'
        required: true
        default: '3.12'
      compute_type:
        description: 'Install either CPU or GPU packages'
        required: true
        default: 'cpu'
      base_registry:
        description: 'Base registry'
        required: true
        default: 'docker.io'
      base_image:
        description: 'Base Image'
        required: true
        default: 'ubuntu'
      base_tag:
        description: 'Base tag'
        required: true
        default: '22.04'
  push:
    branches: [ "dev", "main"]
    paths:
      - 'docker/Dockerfile.python'
      - 'py/install_config/pyproject.toml'
      - '.github/workflows/python-builder.yml'
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  # pull_request:
  #   branches: [ "docker-build-workflows" ]


jobs:
  build:

    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: ${{ github.event.inputs.python_version }}
      COMPUTE_TYPE: ${{ github.event.inputs.compute_type }}
      BASE_REGISTRY: ${{ github.event.inputs.base_registry }}
      BASE_IMAGE: ${{ github.event.inputs.base_image }}
      BASE_TAG: ${{ github.event.inputs.base_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1 # v3.0.0

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          
      - name: Build and push Python Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.python
          push: true
          tags: quay.io/semoss/python-builder:${{ env.PYTHON_VERSION }}-${{ env.COMPUTE_TYPE }}
          build-args: |                    # TODO : Replace environment variables with github input variables before merge to dev and main
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            COMPUTE_TYPE=${{ env.COMPUTE_TYPE }}
            BASE_REGISTRY=${{ env.BASE_REGISTRY }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BASE_TAG=${{ env.BASE_TAG }}
  

