name: Tomcat Builder v2

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  # push:
  #   branches: [ "tomcat-builder" ]
  #   # Publish semver tags as releases.
  workflow_dispatch:
    # inputs:
    #   version:
    #     description: 'Tomcat Version to deploy'
    #     required: true
    #     default: '9.0.12'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
    
    runs-on: ubuntu-latest

    # env:
    #   TOMCAT_VERSION: "9.0.102" 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1 # v3.0.0

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          
      - name: Build and push Tomcat Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.tomcat
          push: false
          tags: quay.io/semoss/tomcat-builder:${{ github.event.inputs.version }}   #replace tag
          build-args: |
            TOMCAT_VERSION=${{ github.event.inputs.version }}
