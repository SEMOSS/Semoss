name: Docker Build and Push images to Quay

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  #schedule:
  #  - cron: '26 16 * * *'
  push:
    branches: [ "docker-build-workflows" ]
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "docker-build-workflows" ]


jobs:
  build:

    runs-on: ubuntu-latest
    # permissions:
    #   contents: read
    #   packages: write
    #   # This is used to complete the identity challenge
    #   # with sigstore/fulcio when running outside of PRs.
    #   id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      # - name: Install cosign
      #   if: github.event_name != 'pull_request'
      #   uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
      #   with:
      #     cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      # - name: Log into registry ${{ env.REGISTRY }}
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
      #   with:
      #     registry: ${{ env.REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
          
      # - name: Log in to Quay
      #   run: |
      #     echo "${{ secrets.QUAY_ROBOT_PASSWORD }}" | docker login quay.io -u ${{ secrets.QUAY_ROBOT_USERNAME }} --password-stdin
      #     docker info

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      # - name: Build and push Python Docker image
      #   run: |
      #     echo "${{ secrets.QUAY_ROBOT_PASSWORD }}" | docker login quay.io -u ${{ secrets.QUAY_ROBOT_USERNAME }} --password-stdin
      #     docker build -t quay.io/semoss/test-quay/docker-python:latest -f ./docker/Dockerfile.python ./docker
      #     echo "${{ secrets.QUAY_ROBOT_PASSWORD }}" | docker login quay.io -u ${{ secrets.QUAY_ROBOT_USERNAME }} --password-stdin
      #     docker push quay.io/semoss/test-quay/docker-python:latest
          
      - name: Build and push Python Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.python
          push: true
          tags: quay.io/semoss/test-quay:docker-python  #replace tag
  
      - name: Build and push Tomcat Docker image
        if: success()
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.tomcat
          push: true
          tags: quay.io/semoss/test-quay:docker-tomcat   #replace tag
  
      - name: Build and push Ubuntu Docker image
        if: success()
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.ubuntu22.04
          push: true
          tags: quay.io/semoss/test-quay:docker-ubuntu

