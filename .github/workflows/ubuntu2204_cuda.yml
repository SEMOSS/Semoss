name: Semoss Ubuntu-CUDA Builder

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "26-cloud-Fix_docker_builds" ]      #TODO: When merging to dev, main replace branch names
    paths:
      - 'docker/Dockerfile.nvidia.cuda.12.5.1.ubuntu22.04'
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  # pull_request:
  #   branches: [ "docker-build-workflows" ]
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1 # v3.0.0

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          
      - name: Determine Image Tag and Repository
        id: vars
        run: |
          if [ "${{ vars.RELEASE }}" = "true" ]; then
            echo "IMAGE_REPO=semoss/semoss" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-ubuntu22-cuda" >> $GITHUB_ENV
          else
            DATE=$(date +'%Y-%m-%d')
            echo "IMAGE_REPO=semoss/semoss-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-SNAPSHOT--ubuntu22-cuda-$DATE" >> $GITHUB_ENV
          fi
          
      - name: Build and push Ubuntu Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.nvidia.cuda.12.5.1.ubuntu22.04
          push: true
          tags: quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}  
