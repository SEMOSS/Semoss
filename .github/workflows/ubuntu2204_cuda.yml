name: Semoss Ubuntu-CUDA Builder

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'docker/Dockerfile.nvidia.cuda.12.5.1.ubuntu22.04'
      - '.github/workflows/ubuntu2204_cuda.yml'
  # pull_request:
  #   branches: [ "docker-build-workflows" ]
  workflow_dispatch:
  schedule:
    - cron: '18 1 * * *'  # Runs every day at 1:18 AM UTC, which is 9:18 PM EDT (8:18 PM EST)


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        fips: [false, true]

    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: quay.io/semoss/test-quay:ubuntu-dind

    steps:
      # - name: Set owner of working dir recurively (Linux)
      #   run: sudo chown -R $(whoami) .
        
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3 # v3.0.0
      #   # with:
      #   #   buildkitd-flags: "--oci-worker-gc-keepstorage=100000,250000,500000 --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host"
          
      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          
      - name: Determine Image Tag and Repository
        id: vars
        run: |
          # -fips goes on the flavour segment so "latest" stays the trailing word
          SUFFIX=""
          if [ "${{ matrix.fips }}" = "true" ]; then SUFFIX="-fips"; fi
          if [ "${{ vars.RELEASE }}" = "TRUE" ]; then
            echo "IMAGE_REPO=semoss/semoss" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-ubuntu22-cuda${SUFFIX}" >> $GITHUB_ENV
          else
            DATE=$(date +'%Y-%m-%d')
            echo "IMAGE_REPO=semoss/semoss-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-SNAPSHOT--ubuntu22-cuda${SUFFIX}-$DATE" >> $GITHUB_ENV
            echo "IMAGE_TAG_LATEST=${{ vars.VERSION }}-SNAPSHOT--ubuntu22-cuda${SUFFIX}-latest" >> $GITHUB_ENV
          fi
          
      - name: Build and push Ubuntu Docker image - Release Build
        if: ${{ vars.RELEASE == 'TRUE' }}
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.nvidia.cuda.12.5.1.ubuntu22.04
          push: true
          pull: true
          tags: quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          no-cache: true
          build-args: |
            SEMOSS_VERSION=${{ vars.VERSION }}
            BASE_REGISTRY=public.ecr.aws
            TOMCAT_TAG_SUFFIX=${{ matrix.fips && '-fips' || '' }}
            SEMOSS_FIPS=${{ matrix.fips }}

      - name: Build and push Ubuntu Docker image - Non-Release Build
        if: ${{ vars.RELEASE == 'FALSE' }}
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.nvidia.cuda.12.5.1.ubuntu22.04
          push: true
          pull: true
          tags: |
            quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_LATEST }}
          no-cache: true
          build-args: |
            SEMOSS_VERSION=${{ vars.VERSION }}-SNAPSHOT
            BASE_REGISTRY=public.ecr.aws
            TOMCAT_TAG_SUFFIX=${{ matrix.fips && '-fips' || '' }}
            SEMOSS_FIPS=${{ matrix.fips }}
