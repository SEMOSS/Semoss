name: Semoss Ubuntu Builder

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python Version to install'
        required: true
        default: '3.12'
      tomcat_version:
        description: 'Tomcat Version to install'
        required: true
        default: '9.0.12'
  push:
    branches: ["dev", "main", "26-dynamic-variables-semoss-builder"]      #TODO: When merging to dev, main replace branch names
    paths:
      - 'docker/Dockerfile.ubuntu22.04'
      - '.github/workflows/ubuntu2204.yml'
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  # pull_request:
  #   branches: [ "docker-build-workflows" ]


jobs:
  build:

    runs-on: self-hosted

    env:
      PYTHON_VERSION: "3.12"
      TOMCAT_VERSION: "9.0.102" 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1 # v3.0.0

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Determine Image Tag and Repository
        id: vars
        run: |
          if [ "${{ vars.RELEASE }}" = "true" ]; then
            echo "IMAGE_REPO=semoss/semoss" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-ubuntu22" >> $GITHUB_ENV
          else
            DATE=$(date +'%Y-%m-%d')
            echo "IMAGE_REPO=semoss/semoss-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-SNAPSHOT-ubuntu22-$DATE" >> $GITHUB_ENV
          fi
          
      - name: Build and push Ubuntu Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.ubuntu22.04
          push: false
          tags: quay.io/semoss/test-quay:docker-ubuntu-${{ env.DATE }}   #TODO: When merging to dev or main, replace this with docker folder tag
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            TOMCAT_VERSION=${{ env.TOMCAT_VERSION }}
