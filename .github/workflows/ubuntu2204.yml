name: Semoss Ubuntu Builder

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "dev", "main" ]      #TODO: When merging to dev, main replace branch names
    paths:
      - 'docker/Dockerfile.ubuntu22.04'
      - '.github/workflows/ubuntu2204.yml'
    # Publish semver tags as releases.
    #tags: [ 'v*.*.*' ]
  # pull_request:
  #   branches: [ "docker-build-workflows" ]
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'  # Runs every day at 8:30 AM UTC, which is 3:30 AM EST

jobs:
  build:

    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: quay.io/semoss/test-quay:ubuntu-dind
    #runs-on: ubuntu-latest

    steps:
    
      # - name: Set owner of working dir recurively (Linux)
      #   run: sudo chown -R $(whoami) .
        
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3 # v3.0.0

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}
          
      - name: Determine Image Tag and Repository
        id: vars
        run: |
          if [ "${{ vars.RELEASE }}" = "TRUE" ]; then
            echo "IMAGE_REPO=semoss/semoss" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-ubuntu22" >> $GITHUB_ENV
          else
            DATE=$(date +'%Y-%m-%d')
            echo "IMAGE_REPO=semoss/semoss-dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=${{ vars.VERSION }}-SNAPSHOT-ubuntu22-$DATE" >> $GITHUB_ENV
            echo "IMAGE_TAG_LATEST=${{ vars.VERSION }}-SNAPSHOT-ubuntu22-latest" >> $GITHUB_ENV
          fi

      - name: Verify Tags
        run: |
          echo "=== ENV (start of step) ==="
          env | sort

          echo
          echo "GITHUB_ENV path: ${GITHUB_ENV:-<not set>}"
          echo "=== GITHUB_ENV contents (what prior steps wrote) ==="
          if [ -n "${GITHUB_ENV:-}" ] && [ -f "$GITHUB_ENV" ]; then
            cat "$GITHUB_ENV"
          else
            echo "<GITHUB_ENV file not found yet>"
          fi

          echo
          echo "=== Values via GitHub contexts (vars) ==="
          echo "vars.RELEASE='${{ vars.RELEASE }}'"
          echo "vars.VERSION='${{ vars.VERSION }}'"
          
      - name: Build and push Ubuntu Docker image - Release Build
        if: ${{ vars.RELEASE == 'TRUE' }}
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.ubuntu22.04
          push: true
          pull: true
          tags: quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          no-cache: true
          build-args: |
            SEMOSS_VERSION=${{ vars.VERSION }}
            BASE_REGISTRY=public.ecr.aws/docker/library

      - name: Build and push Ubuntu Docker image - Non-Release Build
        if: ${{ vars.RELEASE == 'FALSE' }}
        uses: docker/build-push-action@v2
        with:
          context: ./docker
          file: ./docker/Dockerfile.ubuntu22.04
          push: true
          pull: true
          tags: |
            quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_LATEST }}
          no-cache: true
          build-args: |
            SEMOSS_VERSION=${{ vars.VERSION }}-SNAPSHOT
            BASE_REGISTRY=public.ecr.aws/docker/library
