name: Code Server Builder

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "docker/Dockerfile.code-server"
      - ".github/workflows/code-server-builder.yml"
  workflow_dispatch:
    inputs:
      code_server_version:
        description: "codercom/code-server tag to base from"
        required: true
        default: "4.106.3-39"
      codex_extension_id:
        description: "VS Code extension id for Codex (set to 'none' to skip)"
        required: false
        default: "semoss.semoss-codex"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CODE_SERVER_VERSION: ${{ github.event.inputs.code_server_version || '4.106.3-39' }}
      CODEX_EXTENSION_ID: ${{ github.event.inputs.codex_extension_id || 'semoss.semoss-codex' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_PASSWORD }}

      - name: Compute tags
        id: vars
        run: |
          DATE=$(date +'%Y%m%d')
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=semoss/codeserver" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ env.CODE_SERVER_VERSION }}-$DATE" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_LATEST=${{ env.CODE_SERVER_VERSION }}-latest" >> "$GITHUB_ENV"

      - name: Build and push Code Server image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.code-server
          push: true
          tags: |
            quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
            quay.io/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_LATEST }}
          build-args: |
            CODE_SERVER_VERSION=${{ env.CODE_SERVER_VERSION }}
            CODEX_EXTENSION_ID=${{ env.CODEX_EXTENSION_ID }}
