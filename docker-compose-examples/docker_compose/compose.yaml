services:
  semoss:
    image: quay.io/semoss/semoss-dev:5.4.0-SNAPSHOT-ubuntu22-latest
    container_name: semoss
    pull_policy: always
    user: "1001:1001"
    ports:
      - "9090:8080"
    environment:
      SETSOCIAL: 'true'
      REDIRECT: "http://localhost:9090/#/"
      # should not use native for production use cases, instead integrate with external SSO
      ENABLE_NATIVE: 'true'
      ENABLE_NATIVE_REGISTRATION: 'true'
      ENABLE_NATIVE_ACCESS_KEY_ALLOWED: 'true'
      OPTIONAL_COOKIES: 'false'
      FE_ROUTE: /Monolith
      NETTY_PYTHON: 'true'
      NATIVE_PY_SERVER: 'true'
      SMSS_PYTHONHOME: /usr/lib/python/semossvenv
      R_ON: 'false'
      MODEL_INFERENCE_LOGS_ENABLED: 'true'
      USER_TRACKING_ENABLED: 'true'
      PROMPT_DB_ENABLED: 'true'
      AUDIT_LOGS_DATABASE_ENABLED: 'true'

      # chroot
      CHROOT_ENABLE: 'true'
      CHROOT_DIR: /opt/chroot
      CHROOT_SYMLINK_PATHS: /usr/lib/python
      FAKECHROOT_EXCLUDE_PATH: /dev

      # local master
      CUSTOM_LM_RDBMS_TYPE : "postgres"
      CUSTOM_LM_DRIVER: "org.postgresql.Driver"
      CUSTOM_LM_DATABASE: "semoss_localmaster"
      CUSTOM_LM_SCHEMA: "public"
      CUSTOM_LM_USERNAME: "myuser"
      CUSTOM_LM_PASSWORD: "mypassword"
      CUSTOM_LM_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_localmaster?currentSchema=public"
      # model inference logs
      CUSTOM_MODEL_INFERENCE_LOGS_RDBMS_TYPE : "postgres"
      CUSTOM_MODEL_INFERENCE_LOGS_DRIVER: "org.postgresql.Driver"
      CUSTOM_MODEL_INFERENCE_LOGS_DATABASE: "semoss_modellogs"
      CUSTOM_MODEL_INFERENCE_LOGS_SCHEMA: "public"
      CUSTOM_MODEL_INFERENCE_LOGS_USERNAME: "myuser"
      CUSTOM_MODEL_INFERENCE_LOGS_PASSWORD: "mypassword"
      CUSTOM_MODEL_INFERENCE_LOGS_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_modellogs?currentSchema=public"
      # prompt db
      CUSTOM_PROMPT_RDBMS_TYPE : "postgres"
      CUSTOM_PROMPT_DRIVER: "org.postgresql.Driver"
      CUSTOM_PROMPT_DATABASE: "semoss_prompt"
      CUSTOM_PROMPT_SCHEMA: "public"
      CUSTOM_PROMPT_USERNAME: "myuser"
      CUSTOM_PROMPT_PASSWORD: "mypassword"
      CUSTOM_PROMPT_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_prompt?currentSchema=public"
      # scheduler db
      CUSTOM_SCHEDULER_RDBMS_TYPE : "postgres"
      CUSTOM_SCHEDULER_DRIVER: "org.postgresql.Driver"
      CUSTOM_SCHEDULER_DATABASE: "semoss_scheduler"
      CUSTOM_SCHEDULER_SCHEMA: "public"
      CUSTOM_SCHEDULER_USERNAME: "myuser"
      CUSTOM_SCHEDULER_PASSWORD: "mypassword"
      CUSTOM_SCHEDULER_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_scheduler?currentSchema=public"
      # security db
      CUSTOM_SECURITY_RDBMS_TYPE : "postgres"
      CUSTOM_SECURITY_DRIVER: "org.postgresql.Driver"
      CUSTOM_SECURITY_DATABASE: "semoss_security"
      CUSTOM_SECURITY_SCHEMA: "public"
      CUSTOM_SECURITY_USERNAME: "myuser"
      CUSTOM_SECURITY_PASSWORD: "mypassword"
      CUSTOM_SECURITY_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_security?currentSchema=public"
      # themes db
      CUSTOM_THEMES_RDBMS_TYPE : "postgres"
      CUSTOM_THEMES_DRIVER: "org.postgresql.Driver"
      CUSTOM_THEMES_DATABASE: "semoss_themes"
      CUSTOM_THEMES_SCHEMA: "public"
      CUSTOM_THEMES_USERNAME: "myuser"
      CUSTOM_THEMES_PASSWORD: "mypassword"
      CUSTOM_THEMES_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_themes?currentSchema=public"
      # user tracking db
      CUSTOM_USER_TRACKING_RDBMS_TYPE : "postgres"
      CUSTOM_USER_TRACKING_DRIVER: "org.postgresql.Driver"
      CUSTOM_USER_TRACKING_DATABASE: "semoss_usertracking"
      CUSTOM_USER_TRACKING_SCHEMA: "public"
      CUSTOM_USER_TRACKING_USERNAME: "myuser"
      CUSTOM_USER_TRACKING_PASSWORD: "mypassword"
      CUSTOM_USER_TRACKING_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_usertracking?currentSchema=public"
      # audit logs
      CUSTOM_AUDITLOGS_RDBMS_TYPE : "postgres"
      CUSTOM_AUDITLOGS_DRIVER: "org.postgresql.Driver"
      CUSTOM_AUDITLOGS_DATABASE: "semoss_audit"
      CUSTOM_AUDITLOGS_SCHEMA: "public"
      CUSTOM_AUDITLOGS_USERNAME: "myuser"
      CUSTOM_AUDITLOGS_PASSWORD: "mypassword"
      CUSTOM_AUDITLOGS_CONNECTION_URL: "jdbc:postgresql://db:5432/semoss_audit?currentSchema=public"
    command: /bin/bash -c "runCS.sh"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - semoss_db:/opt/semosshome/db
      - semoss_project:/opt/semosshome/project
      - semoss_model:/opt/semosshome/model
      - semoss_vector:/opt/semosshome/vector
      - semoss_storage:/opt/semosshome/storage
      - semoss_function:/opt/semosshome/function
      - semoss_guardrail:/opt/semosshome/guardrail
    networks:
      - mynetwork

  db:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myuser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork

  # Apache Jena Fuseki — SPARQL 1.1 server backed by TDB2.
  # Powers the Jena GraphRAG engine (see RemoteJenaEngine). Reached from the
  # semoss container at http://fuseki:3030/<dataset>/sparql|update.
  #
  # Container image: stain/jena-fuseki is the most widely-used community image,
  # built on eclipse-temurin:21-jre-alpine from the official Apache Fuseki
  # tarball (checksum-verified). Swap for a self-built Fuseki image if
  # enterprise policy requires only official Apache binaries.
  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: fuseki
    restart: always
    ports:
      - "3030:3030"
    environment:
      # Local dev credentials — OVERRIDE for any deployment outside your laptop.
      ADMIN_PASSWORD: "admin"
      # TDB2 storage engine (matches jena-arq 5.x used inside SEMOSS).
      TDB: "2"
      # Auto-provision a default dataset "kb" on first boot. The Jena GraphRAG
      # engine points at http://fuseki:3030/kb/sparql for queries and
      # http://fuseki:3030/kb/update for writes.
      FUSEKI_DATASET_1: "kb"
      JVM_ARGS: "-Xmx2g"
    volumes:
      - fuseki_data:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3030/$$/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mynetwork

volumes:
  semoss_db:
  semoss_project:
  semoss_model:
  semoss_vector:
  semoss_storage:
  semoss_function:
  semoss_guardrail:
  pgdata:
  fuseki_data:

networks:
  mynetwork:
